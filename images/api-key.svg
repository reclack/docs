<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="The parts of a Reclack API key">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f86b5"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ttl { font-size: 13.5px; font-weight: 600; fill: #16151f; }
      .big { font-size: 15px; font-weight: 600; fill: #16151f; }
      .who { font-size: 11px; fill: #8a86a3; letter-spacing: 0.08em; }
      .note { font-size: 11.5px; fill: #6f6b85; }
      .rail { stroke: #e2def2; stroke-width: 2; }
      .dot { fill: #533afd; }
      .edge { stroke: #c9c5de; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
    </style>
  </defs>
  <rect width="880" height="310" fill="#ffffff"/>
  <g class="t">
    <rect x="140" y="70" width="600" height="56" rx="12" fill="#f8f7fc"/>
    <text class="m" x="170" y="104" font-size="15" fill="#533afd" font-weight="600">rk_</text>
    <text class="m" x="197.3" y="104" font-size="15" fill="#b45309" font-weight="600">live_</text>
    <text class="m" x="242.8" y="104" font-size="15" fill="#16151f" font-weight="600">4Kd9ZmPq7Fh2XbN3Rt8Vw1Ys6Uc0Ae5G</text>
    <path d="M170,136 v8 h28 v-8" stroke="#e2def2" stroke-width="1.5" fill="none"/>
    <path d="M198,136 v8 h46 v-8" stroke="#e2def2" stroke-width="1.5" fill="none"/>
    <path d="M244,136 v8 h466 v-8" stroke="#e2def2" stroke-width="1.5" fill="none"/>
    <path d="M184,148 v10 h-40" stroke="#e2def2" stroke-width="1.5" fill="none"/>
    <text class="note" x="138" y="162" text-anchor="end">Reclack key</text>
    <path d="M221,148 v30 h40" stroke="#e2def2" stroke-width="1.5" fill="none"/>
    <text class="note" x="268" y="182">Environment: sandbox or live</text>
    <text class="note" x="477" y="168" text-anchor="middle">32 random characters</text>
    <text class="who" x="140" y="222">SEND IT IN THIS HEADER</text>
    <rect x="140" y="236" width="133.2" height="21" rx="10.5" fill="#ece9ff"/>
    <text class="m" x="149" y="250.5" font-size="11" fill="#533afd" font-weight="600">Api-Key: rk_live_…</text>
    <text class="note" x="300" y="251">X-API-Key is accepted too.</text>
    <text class="note" x="140" y="286">The secret half is shown once, at creation. Reclack stores only a digest of it.</text>
  </g>
</svg>
