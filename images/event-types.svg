<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="The events Reclack emits, by the object they belong to">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f86b5"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ttl { font-size: 13.5px; font-weight: 600; fill: #16151f; }
      .big { font-size: 15px; font-weight: 600; fill: #16151f; }
      .who { font-size: 11px; fill: #8a86a3; letter-spacing: 0.08em; }
      .note { font-size: 11.5px; fill: #6f6b85; }
      .rail { stroke: #e2def2; stroke-width: 2; }
      .dot { fill: #533afd; }
      .edge { stroke: #c9c5de; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
    </style>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>
  <g class="t">
    <rect x="40" y="56" width="380" height="116" rx="12" fill="#ffffff" stroke="#e2def2" stroke-width="1.5"/>
    <text class="who" x="64" y="84">PAYMENTS</text>
    <circle cx="68" cy="106" r="3" fill="#533afd"/>
    <text class="m" x="84" y="110" font-size="11.5" fill="#16151f">payment.succeeded</text>
    <text class="note" x="396" y="110" text-anchor="end">Confirmed onchain</text>
    <circle cx="68" cy="128" r="3" fill="#533afd"/>
    <text class="m" x="84" y="132" font-size="11.5" fill="#16151f">payment.failed</text>
    <text class="note" x="396" y="132" text-anchor="end">Did not confirm</text>
    <rect x="460" y="56" width="380" height="116" rx="12" fill="#ffffff" stroke="#e2def2" stroke-width="1.5"/>
    <text class="who" x="484" y="84">INVOICES</text>
    <circle cx="488" cy="106" r="3" fill="#533afd"/>
    <text class="m" x="504" y="110" font-size="11.5" fill="#16151f">invoice.paid</text>
    <text class="note" x="816" y="110" text-anchor="end">Settled in full</text>
    <circle cx="488" cy="128" r="3" fill="#533afd"/>
    <text class="m" x="504" y="132" font-size="11.5" fill="#16151f">invoice.overdue</text>
    <text class="note" x="816" y="132" text-anchor="end">Past its due date</text>
    <rect x="40" y="192" width="380" height="116" rx="12" fill="#ffffff" stroke="#e2def2" stroke-width="1.5"/>
    <text class="who" x="64" y="220">SUBSCRIPTIONS</text>
    <circle cx="68" cy="242" r="3" fill="#533afd"/>
    <text class="m" x="84" y="246" font-size="11.5" fill="#16151f">subscription.created</text>
    <text class="note" x="396" y="246" text-anchor="end">First payment cleared</text>
    <circle cx="68" cy="264" r="3" fill="#533afd"/>
    <text class="m" x="84" y="268" font-size="11.5" fill="#16151f">subscription.renewed</text>
    <text class="note" x="396" y="268" text-anchor="end">A period collected</text>
    <circle cx="68" cy="286" r="3" fill="#533afd"/>
    <text class="m" x="84" y="290" font-size="11.5" fill="#16151f">subscription.cancelled</text>
    <text class="note" x="396" y="290" text-anchor="end">No further collection</text>
    <rect x="460" y="192" width="380" height="116" rx="12" fill="#ffffff" stroke="#e2def2" stroke-width="1.5"/>
    <text class="who" x="484" y="220">CHECKOUT</text>
    <circle cx="488" cy="242" r="3" fill="#533afd"/>
    <text class="m" x="504" y="246" font-size="11.5" fill="#16151f">checkout.completed</text>
    <text class="note" x="816" y="246" text-anchor="end">The session was paid</text>
    <circle cx="488" cy="264" r="3" fill="#533afd"/>
    <text class="m" x="504" y="268" font-size="11.5" fill="#16151f">customer.created</text>
    <text class="note" x="816" y="268" text-anchor="end">A new payer record</text>
    <text class="note" x="440" y="318" text-anchor="middle">Subscribe to what you handle. An endpoint only receives the types it asks for.</text>
  </g>
</svg>
