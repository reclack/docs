<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Usage recorded through a period, billed when it closes">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f86b5"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ttl { font-size: 13.5px; font-weight: 600; fill: #16151f; }
      .big { font-size: 15px; font-weight: 600; fill: #16151f; }
      .who { font-size: 11px; fill: #8a86a3; letter-spacing: 0.08em; }
      .note { font-size: 11.5px; fill: #6f6b85; }
      .mono { font-size: 11.5px; fill: #16151f; }
      .monom { font-size: 11.5px; fill: #6f6b85; }
      .rail { stroke: #e2def2; stroke-width: 2; }
      .dot { fill: #533afd; }
      .edge { stroke: #c9c5de; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
    </style>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>
  <g class="t">
    <text class="who" x="40" y="70">USAGE RECORDED</text>
    <rect x="48" y="172" width="22" height="18" rx="4" fill="#533afd" opacity="0.35"/>
    <rect x="84" y="164" width="22" height="26" rx="4" fill="#533afd" opacity="0.39999999999999997"/>
    <rect x="120" y="168" width="22" height="22" rx="4" fill="#533afd" opacity="0.44999999999999996"/>
    <rect x="156" y="152" width="22" height="38" rx="4" fill="#533afd" opacity="0.5"/>
    <rect x="192" y="159" width="22" height="31" rx="4" fill="#533afd" opacity="0.55"/>
    <rect x="228" y="146" width="22" height="44" rx="4" fill="#533afd" opacity="0.6"/>
    <rect x="264" y="138" width="22" height="52" rx="4" fill="#533afd" opacity="0.65"/>
    <rect x="300" y="150" width="22" height="40" rx="4" fill="#533afd" opacity="0.7"/>
    <rect x="336" y="132" width="22" height="58" rx="4" fill="#533afd" opacity="0.75"/>
    <rect x="372" y="124" width="22" height="66" rx="4" fill="#533afd" opacity="0.8"/>
    <rect x="408" y="129" width="22" height="61" rx="4" fill="#533afd" opacity="0.85"/>
    <rect x="444" y="116" width="22" height="74" rx="4" fill="#533afd" opacity="0.9"/>
    <line x1="40" y1="192" x2="490" y2="192" stroke="#e2def2" stroke-width="2"/>
    <text class="note" x="40" y="214">Oct 1</text>
    <text class="note" x="470" y="214" text-anchor="end">Oct 31</text>
    <text class="note" x="40" y="250">Every record carries an idempotency key, so a retry cannot bill twice.</text>
    <path class="edge" d="M506,150 L570,150"/>
    <rect x="590" y="70" width="250" height="180" rx="12" fill="#ffffff" stroke="#e2def2" stroke-width="1.5"/>
    <text class="big" x="614" y="104">Invoice at close</text>
    <text class="m" x="614" y="128" font-size="11.5" fill="#6f6b85">48,210 requests</text>
    <text class="m" x="614" y="150" font-size="11.5" fill="#6f6b85">× 0.0025 USDC</text>
    <line x1="606" y1="166" x2="824" y2="166" stroke="#e2def2" stroke-width="1.5"/>
    <text class="t" x="614" y="192" font-size="16" font-weight="600" fill="#16151f">120.53 USDC</text>
    <rect x="614" y="210" width="170.5" height="21" rx="10.5" fill="#ece9ff"/>
    <text class="t" x="623" y="224.5" font-size="11" fill="#533afd" font-weight="600">Collected on the approval</text>
  </g>
</svg>
