<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Sandbox and live, side by side">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8496"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ttl { font-size: 13.5px; font-weight: 600; fill: #eef1f5; }
      .big { font-size: 15px; font-weight: 600; fill: #eef1f5; }
      .who { font-size: 11px; fill: #7d8495; letter-spacing: 0.08em; }
      .note { font-size: 11.5px; fill: #a4abba; }
      .rail { stroke: #252b35; stroke-width: 2; }
      .dot { fill: #8f7dff; }
      .edge { stroke: #39404d; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
    </style>
  </defs>
  <rect width="880" height="300" fill="#0b0d11"/>
  <g class="t">
    <rect x="40" y="50" width="380" height="210" rx="12" fill="#14171d" stroke="#252b35" stroke-width="1.5"/>
    <text class="big" x="64" y="84">Sandbox</text>
    <rect x="290" y="68" width="82.0" height="21" rx="10.5" fill="#231f3a"/>
    <text class="m" x="299" y="82.5" font-size="11" fill="#8f7dff" font-weight="600">rk_sandbox</text>
    <line x1="40" y1="104" x2="420" y2="104" stroke="#252b35" stroke-width="1.5"/>
    <text class="who" x="64" y="130">NETWORKS</text>
    <text class="note" x="64" y="150">Base Sepolia, Ethereum Sepolia</text>
    <circle cx="68" cy="174" r="3" fill="#8f7dff"/>
    <text class="note" x="84" y="178">Test tokens from a faucet</text>
    <circle cx="68" cy="198" r="3" fill="#8f7dff"/>
    <text class="note" x="84" y="202">Same objects, same events</text>
    <circle cx="68" cy="222" r="3" fill="#8f7dff"/>
    <text class="note" x="84" y="226">Safe to break</text>
    <rect x="460" y="50" width="380" height="210" rx="12" fill="#14171d" stroke="#252b35" stroke-width="1.5"/>
    <text class="big" x="484" y="84">Live</text>
    <rect x="710" y="68" width="62.8" height="21" rx="10.5" fill="#13301e"/>
    <text class="m" x="719" y="82.5" font-size="11" fill="#4ade80" font-weight="600">rk_live</text>
    <line x1="460" y1="104" x2="840" y2="104" stroke="#252b35" stroke-width="1.5"/>
    <text class="who" x="484" y="130">NETWORKS</text>
    <text class="note" x="484" y="150">Base, Ethereum, Polygon</text>
    <circle cx="488" cy="174" r="3" fill="#4ade80"/>
    <text class="note" x="504" y="178">Real money, real wallets</text>
    <circle cx="488" cy="198" r="3" fill="#4ade80"/>
    <text class="note" x="504" y="202">Settles to your address</text>
    <circle cx="488" cy="222" r="3" fill="#4ade80"/>
    <text class="note" x="504" y="226">Transactions are final</text>
    <text class="note" x="440" y="288" text-anchor="middle">One base URL serves both. The key you present decides which one you are talking to.</text>
  </g>
</svg>
