<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="What happens in a billing period">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .h { font-size: 13.5px; font-weight: 600; fill: #16151f; }
      .n { font-size: 11.5px; fill: #6f6b85; }
      .k { font-size: 10.5px; fill: #8a86a3; letter-spacing: 0.1em; }
      .card { fill: #ffffff; stroke: #e2def2; stroke-width: 1.5; rx: 12; }
      .bar { fill: #ece9ff; rx: 3; }
      .fill { fill: #533afd; rx: 3; }
      .tick { stroke: #d7d2ee; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>
  <g class="t">
    <text class="k" x="40" y="40">ONE BILLING PERIOD</text>

    <rect class="bar" x="40" y="60" width="800" height="8"/>
    <rect class="fill" x="40" y="60" width="200" height="8"/>

    <line class="tick" x1="40" y1="52" x2="40" y2="80"/>
    <line class="tick" x1="240" y1="52" x2="240" y2="80"/>
    <line class="tick" x1="470" y1="52" x2="470" y2="80"/>
    <line class="tick" x1="700" y1="52" x2="700" y2="80"/>

    <rect class="card" x="40" y="106" width="185" height="140"/>
    <text class="h" x="60" y="140">Period opens</text>
    <text class="n" x="60" y="166">On its own date, with</text>
    <text class="n" x="60" y="184">no cron on your side.</text>
    <text class="n" x="60" y="210">One invoice per period,</text>
    <text class="n" x="60" y="228">enforced in the database.</text>

    <rect class="card" x="245" y="106" width="185" height="140"/>
    <text class="h" x="265" y="140">Collection runs</text>
    <text class="n" x="265" y="166">Submitted against the</text>
    <text class="n" x="265" y="184">signed authorization,</text>
    <text class="n" x="265" y="210">never above its cap.</text>

    <rect class="card" x="450" y="106" width="185" height="140"/>
    <text class="h" x="470" y="140">Chain confirms</text>
    <text class="n" x="470" y="166">The transaction is</text>
    <text class="n" x="470" y="184">followed to a confirmed</text>
    <text class="n" x="470" y="210">state before anything</text>
    <text class="n" x="470" y="228">is marked paid.</text>

    <rect class="card" x="655" y="106" width="185" height="140"/>
    <text class="h" x="675" y="140">You are told</text>
    <text class="n" x="675" y="166">subscription.renewed</text>
    <text class="n" x="675" y="184">and invoice.paid, signed,</text>
    <text class="n" x="675" y="210">with retries if your</text>
    <text class="n" x="675" y="228">endpoint is down.</text>

    <text class="k" x="40" y="278">FAILURES RETRY ON A SPACED SCHEDULE, THEN THE SUBSCRIPTION PAUSES</text>
  </g>
</svg>
