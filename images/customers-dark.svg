      .who { font-size: 11px; fill: #7d8495; letter-spacing: 0.08em; }
      .note { font-size: 11.5px; fill: #a4abba; }
      .rail { stroke: #252b35; stroke-width: 2; }
      .dot { fill: #8f7dff; }
      .edge { stroke: #39404d; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
