  </defs>
  <rect width="880" height="270" fill="#0b0d11"/>
  <g class="t">
    <rect x="40" y="60" width="350" height="150" rx="12" fill="#14171d" stroke="#252b35" stroke-width="1.5"/>
    <text class="who" x="64" y="92">YOUR DATABASE</text>
    <text class="m" x="64" y="122" font-size="11.5" fill="#a4abba">id</text>
    <text class="m" x="190" y="122" font-size="11.5" fill="#eef1f5">4821</text>
    <text class="m" x="64" y="148" font-size="11.5" fill="#a4abba">email</text>
    <text class="m" x="190" y="148" font-size="11.5" fill="#eef1f5">dana@acme.dev</text>
    <text class="m" x="64" y="174" font-size="11.5" fill="#a4abba">plan</text>
    <text class="m" x="190" y="174" font-size="11.5" fill="#eef1f5">pro</text>
    <rect x="490" y="60" width="350" height="150" rx="12" fill="#14171d" stroke="#252b35" stroke-width="1.5"/>
    <text class="who" x="514" y="92">RECLACK CUSTOMER</text>
    <text class="m" x="514" y="122" font-size="11.5" fill="#a4abba">id</text>
    <text class="m" x="640" y="122" font-size="11.5" fill="#eef1f5">cus_7Fh2PqX9</text>
    <text class="m" x="514" y="148" font-size="11.5" fill="#a4abba">email</text>
    <text class="m" x="640" y="148" font-size="11.5" fill="#eef1f5">dana@acme.dev</text>
    <text class="m" x="514" y="174" font-size="11.5" fill="#a4abba">external_id</text>
    <text class="m" x="640" y="174" font-size="11.5" fill="#8f7dff">user_4821</text>
    <path class="edge" d="M398,135 L482,135"/>
    <text class="m" x="440" y="118" text-anchor="middle" font-size="11" fill="#7d8495">external_id</text>
    <text class="note" x="440" y="244" text-anchor="middle">Send your own id and you can find the customer later without storing ours.</text>
