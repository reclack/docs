<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="An invoice moving from draft to paid">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8496"/>
    </marker>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ttl { font-size: 13.5px; font-weight: 600; fill: #eef1f5; }
      .big { font-size: 15px; font-weight: 600; fill: #eef1f5; }
      .who { font-size: 11px; fill: #7d8495; letter-spacing: 0.08em; }
      .note { font-size: 11.5px; fill: #a4abba; }
      .rail { stroke: #252b35; stroke-width: 2; }
      .dot { fill: #8f7dff; }
      .edge { stroke: #39404d; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
    </style>
  </defs>
  <rect width="880" height="330" fill="#0b0d11"/>
  <g class="t">
    <rect x="40" y="50" width="330" height="230" rx="12" fill="#14171d" stroke="#252b35" stroke-width="1.5"/>
    <text class="m" x="64" y="84" font-size="13" fill="#eef1f5" font-weight="600">INV-00182</text>
    <rect x="280" y="68" width="42.4" height="21" rx="10.5" fill="#231f3a"/>
    <text class="t" x="289" y="82.5" font-size="11" fill="#8f7dff" font-weight="600">Open</text>
    <text class="note" x="64" y="106">Issued Oct 16 · due Nov 10</text>
    <line x1="56" y1="124" x2="354" y2="124" stroke="#252b35" stroke-width="1.5"/>
    <text class="note" x="64" y="150">Platform seats (4)</text>
    <text class="m" x="346" y="150" text-anchor="end" font-size="11.5" fill="#eef1f5">80.00</text>
    <text class="note" x="64" y="174">Support retainer</text>
    <text class="m" x="346" y="174" text-anchor="end" font-size="11.5" fill="#eef1f5">40.00</text>
    <line x1="56" y1="208" x2="354" y2="208" stroke="#252b35" stroke-width="1.5"/>
    <text class="ttl" x="64" y="232">Total due</text>
    <text class="m" x="346" y="232" text-anchor="end" font-size="12" fill="#eef1f5" font-weight="600">120.00 USDC</text>
    <rect x="64" y="248" width="290" height="18" rx="9" fill="#8f7dff"/>
    <text class="t" x="209" y="261" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">Pay invoice</text>
    <line x1="470" y1="90" x2="470" y2="250" stroke="#252b35" stroke-width="2"/>
    <circle cx="470" cy="96" r="6" fill="#8f7dff"/>
    <text class="ttl" x="496" y="94">Draft</text>
    <text class="note" x="496" y="112">Edit freely</text>
    <circle cx="470" cy="148" r="6" fill="#8f7dff"/>
    <text class="ttl" x="496" y="146">Sent</text>
    <text class="note" x="496" y="164">Emailed with the PDF</text>
    <circle cx="470" cy="200" r="6" fill="#39404e"/>
    <text class="ttl" x="496" y="198">Paying</text>
    <text class="note" x="496" y="216">Followed onchain</text>
    <circle cx="470" cy="252" r="6" fill="#39404e"/>
    <text class="ttl" x="496" y="250">Paid</text>
    <text class="note" x="496" y="268">Receipt sent, reminders stopped</text>
  </g>
</svg>
